* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* cinta "ejemplo" y llamado a CVRCVMO */
.cvr { position: fixed; z-index: 50; right: max(12px, env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(10,10,11,.72); color: #E8E9EC; font: 500 11px/1 "Manrope", system-ui, sans-serif; letter-spacing: .02em; text-decoration: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.cvr img { width: 22px; height: 22px; border-radius: 6px; }
.cvr b { font-weight: 500; color: #fff; }

/* dedo y onda del video */
.touch { position: fixed; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 4px 18px rgba(0,0,0,.35), inset 0 0 0 2px #fff; pointer-events: none; z-index: 90; opacity: 0; }
.ripple { position: fixed; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid rgba(255,255,255,.95); pointer-events: none; z-index: 89; opacity: 0; }

/* textos de entrada y cierre del video */
.vtitle { position: fixed; left: 0; right: 0; z-index: 80; display: none; text-align: center; padding: 0 24px; opacity: 0; pointer-events: none; }
.vend { position: fixed; inset: 0; z-index: 85; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 0 28px; background: rgba(10,10,11,.9); color: #E8E9EC; opacity: 0; pointer-events: none; font-family: "Manrope", system-ui, sans-serif; }
.vend img { width: 96px; height: 96px; border-radius: 24px; }
.vend b { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.05; color: #fff; }
.vend span { font-size: 16px; color: #B9BAC0; }
.vend small { margin-top: 10px; padding: 10px 18px; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF 0%, #DADDE2 45%, #9EA5AF 52%, #F4F5F7 70%, #C9CDD3 100%); color: #0A0A0B; font: 600 14px/1 "Geist", system-ui, sans-serif; letter-spacing: .02em; }

/* el texto de ayuda se va solo para no estorbar con la cinta de abajo */
.hint { animation: hintOut .6s ease 6s forwards; }
@keyframes hintOut { to { opacity: 0; visibility: hidden; } }
@media (max-width: 600px) { .cvr span { display: none; } .cvr { padding: 6px; } }
.loader { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; transition: opacity .6s ease; }
.loader.out { opacity: 0; pointer-events: none; }
.video *, .video *::before, .video *::after { transition: none !important; }
.video .cvr { display: none; }
</style>
<style>
  :root { --ink: #F6EFE4; --mute: #A9B7B5; --glass: rgba(8,22,27,.66); --line: rgba(246,239,228,.14); --sand: #F2D4A7; --coral: #FF7A59; }
  body { background: #071419; font-family: "Manrope", system-ui, sans-serif; color: var(--ink); }
  .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(16px + env(safe-area-inset-top)) 16px 0; text-align: center; pointer-events: none; }
  .logo { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 700; font-size: 34px; line-height: 1; color: var(--sand); }
  .hdr small { display: block; margin-top: 8px; font: 500 10px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--mute); }
  .card { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: calc(46px + env(safe-area-inset-bottom)); padding: 18px 18px 16px; border-radius: 24px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .kick { font: 500 10px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--coral); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(246,239,228,.28); transition: width .3s, background .3s; }
  .dots i.on { width: 18px; background: var(--sand); }
  .name { margin-top: 10px; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 700; font-size: 32px; line-height: 1.05; }
  .ing { margin-top: 8px; min-height: 40px; font-size: 14px; line-height: 1.45; color: var(--mute); }
  .buy { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .price { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 700; font-size: 30px; color: var(--sand); }
  .price small { font: 500 12px/1 "Manrope", sans-serif; font-style: normal; color: var(--mute); margin-left: 4px; }
  .nav { display: flex; gap: 8px; align-items: center; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
  .arrow svg { width: 18px; height: 18px; }
  .btn { display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--sand); color: #10201F; font-weight: 500; font-size: 15px; text-decoration: none; }
  .hint { position: fixed; z-index: 9; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom)); text-align: center; font: 500 10px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); pointer-events: none; }
  @media (min-aspect-ratio: 1/1) {
    .card { left: auto; right: max(28px, 4vw); top: 50%; bottom: auto; width: 380px; transform: translateY(-50%); }
    .hdr { text-align: left; padding-left: max(28px, 4vw); }
    .logo { font-size: 40px; }
